
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Produtos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Cadastro de Produtos</h1>

        <form class="form-produto" name = "f1" action = "controller" method = "GET">

            <div class="input-group">
                <label>ID</label>
                <input type="number" name = "txtid">
            </div>

            <div class="input-group" >
                <label>Nome</label>
                <input type="text" name = "txtnome">
            </div>

            <div class="input-group">
                <label>Marca</label>
                <input type="text" name = "txtmarca">
            </div>

            <div class="input-group">
                <label>Categoria</label>
                <input type="text" name = "txtcategoria">
            </div>

            <div class="input-group">
                <label>Preço</label>
                <input type="number" name = "txtpreco">
            </div>

            <div class="input-group">
                <label>Quantidade</label>
                <input type="number" name = "txtquantidade">
            </div>

            <div class="input-group">
                <label>Cor</label>
                <input type="text" name = "txtcor">
            </div>

            <div class="input-group">
                <label>Peso</label>
                <input type="number" name = "txtpeso">
            </div>

            <div class="input-group">
                <label>Descrição</label>
                <textarea name = "txtdescricao"></textarea>
            </div>

            <div class="input-group">
                <label>Data de Cadastro</label>
                <input type="date" name ="txtDataCadastro">
            </div>

            <div class="botoes">

                <button class="btn salvar" type ="submit" name = "op" value = "CADASTRAR">
                    Salvar
                </button>

                <button class="btn atualizar" type ="submit" name = "op" value = "ATUALIZAR">
                    Atualizar
                </button>

                <button class="btn deletar" type ="submit" name = "op" value = "DELETAR">
                    Deletar
                </button>

                <button class="btn consultar" type ="submit" name = "op" value = "CONSULTAR POR ID">
                    Consultar por Id
                </button>
                
                <button class="btn consultar" type ="submit" name="op" value="CONSULTAR TODOS">
                    Consultar Tudo
                </button>

            </div>

        </form>

    </div>

</body>

</html>
